task: copa_en
# `test` is the original labeled COPA test split (items 501-1000); only this repo's
# `train` split carries Balanced COPA's mirrored items.
dataset_path: pkavumba/balanced-copa
test_split: test
fewshot_split: train
output_type: multiple_choice
doc_to_text: !function utils.doc_to_text
doc_to_target: label
doc_to_choice: !function utils.doc_to_choice
should_decontaminate: true
doc_to_decontamination_query: premise
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
  - metric: acc_bytes
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
